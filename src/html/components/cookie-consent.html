
<!-- COOKIE CONSENT -->
<aside class="cookie-consent u-reveal-fade u-delay-6" aria-labelledby="cookie-consent-title">

    <hgroup class="cookie-consent__content">
      <h2 class="cookie-consent__title" id="cookie-consent-title">
        Sua privacidade importa
      </h2>

      <p class="cookie-consent__description">
        Utilizamos cookies necessários para o funcionamento do site e,
        com sua autorização, cookies de análise para entender como ele é utilizado.
        Saiba mais em nossa
        <a class="button is-link and-policy" href="/html/pages/cookies.html">Política de Cookies</a>.
      </p>
    </hgroup>

    <div class="cookie-consent__actions">
      <button class="cookie-consent__button button primary is-policy alt size-md" type="button" data-cookie-consent="reject">
        Rejeitar
      </button>
      
      <button class="cookie-consent__button button primary is-policy size-md" type="button" data-cookie-consent="accept">
        Aceitar
      </button>
    </div>

</aside>
